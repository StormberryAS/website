# GitHub Pages serves stormberry.as from this repository root.
#
# Without this file Jekyll publishes the WHOLE repository, so the tooling scripts, the
# README and the licence were all reachable from the live site. Nothing here was secret,
# these repos are public, but source and tooling have no business being served next to
# the product.
#
# Added 2026-09-05 in the estate-wide sweep that followed finding
# scheduler.stormberry.as/index.dev.html live, a second working rendering of that app.
#
# Jekyll's `exclude` REPLACES its defaults rather than adding to them, which is why
# node_modules/ and friends are listed where they apply.
#
# disclaimer.html and privacy.html are deliberately NOT excluded: they are the published
# pages the footer links to. Only the Markdown sources are withheld.
#
# .npmrc holds only npm settings, no secrets, but tooling config has no business being
# served. The hex-named .txt at the root is a live domain-verification file and is
# deliberately NOT excluded; removing it from the site would break the verification.
#
# cloudflare-worker/ is deployed by wrangler, not by Pages. Excluded 2026-09-24:
# before that its source, tests and wrangler.toml (with the exact rate-limit
# thresholds) were served from stormberry.as next to the product.
#
# The TypeScript sources (ts/), their build tooling (tools/, package.json, package-lock.json,
# tsconfig.json) and the installed compiler (node_modules/, never committed) are excluded
# too: the pages load only the compiled script.js at the root. Added with the
# TypeScript move. Keep every list item bare, with no comment on its line:
# stormberry-nsite-build.py reads this list to curate the nsite as well.
# Jekyll skips every path that starts with a dot, so the Web Key Directory under
# .well-known/openpgpkey/ (added 2026-10-17: mail apps find the mail key for
# marcos@stormberry.as there) must be included explicitly. .well-known/nostr.json is
# answered by Cloudflare before GitHub is reached, so including it changes nothing.
include:
  - .well-known

exclude:
  - .npmrc
  - LICENSE
  - PREVIEW-V2.md
  - README.md
  - __pycache__/
  - add_llms_link.py
  - cloudflare-worker/
  - bump_assets.py
  - generate_sitemap.py
  - make_svg.py
  - patch_title.py
  - trace.py
  - node_modules/
  - package.json
  - package-lock.json
  - tsconfig.json
  - ts/
  - tools/
