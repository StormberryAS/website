name = "stormberry-contact-form"
main = "index.js"
compatibility_date = "2024-03-20"

[vars]
ADMIN_EMAIL = "info@stormberry.as"

# Persist console.log/console.error to Workers Logs in the dashboard, so a
# delivery problem is visible without having to be tailing at the time.
[observability]
enabled = true

# Keep the console lines above (already scrubbed of personal data) but drop the
# automatic per-request invocation log, which records request metadata for every
# submission whether or not anything went wrong.
[observability.logs]
invocation_logs = false

# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   RESEND_API_KEY         sending key for the verified stormberry.as domain
#   TURNSTILE_SECRET_KEY   Turnstile secret for sitekey 0x4AAAAAACsqoaM-PpNxpS3n
#   RESEND_WEBHOOK_SECRET  whsec_... shown once when the webhook is created
#   ALERT_EMAIL            bounce alerts go here; must NOT be info@stormberry.as
#
# Resend webhook endpoint to register in the dashboard:
#   https://stormberry-contact-form.marcos-495.workers.dev/resend-webhook
#   events: email.bounced, email.complained, email.delivery_delayed, email.failed

# Worker-native rate limiting. This Worker has no [[routes]] block, so it is
# served from its workers.dev subdomain and NO zone WAF rate-limiting rule can
# apply to it. These bindings are therefore the only real limit on the endpoint.
#   *_IP        caps one source hammering the form.
#   *_RECIPIENT caps how often any source can cause mail to one address, which is
#               the sendCopy nuisance vector.
# period must be 10 or 60.
[[unsafe.bindings]]
name = "CONTACT_RATE_LIMIT_IP"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "CONTACT_RATE_LIMIT_RECIPIENT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 2, period = 60 }
